name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server.json']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          LATEST=$(curl -sI https://github.com/modelcontextprotocol/registry/releases/latest | grep -i location | awk -F/ '{print $NF}' | tr -d '\r')
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/${LATEST}/mcp-publisher_linux_amd64.tar.gz" -o pub.tar.gz
          file pub.tar.gz
          tar xzf pub.tar.gz
          chmod +x mcp-publisher
      - name: Login
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish --file=server.json
