name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: curl -L -f -o pub.tar.gz "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" && tar xzf pub.tar.gz mcp-publisher && chmod +x mcp-publisher
      - name: Login
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish --file=server.json
