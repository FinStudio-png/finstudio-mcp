      - name: Install mcp-publisher
        run: |
          curl -L -f -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          
          # Verify the file is actually a gzip archive
          if ! file mcp-publisher.tar.gz | grep -q "gzip compressed data"; then
            echo "Error: Downloaded file is not a valid gzip archive"
            echo "File type:"
            file mcp-publisher.tar.gz
            echo "File contents (first 200 bytes):"
            head -c 200 mcp-publisher.tar.gz
            exit 1
          fi
          
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
