name: Publish to MCP Registry
on:
  push:
    branches: [main]
    paths: ['server.json']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/latest/mcp-publisher_linux_amd64.tar.gz" | tar xz
          chmod +x mcp-publisher
      - name: Login and Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
